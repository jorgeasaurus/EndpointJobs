name: Home HTML size

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: home-html-size-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  home-html-size:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check prerendered home HTML
        run: npm run audit:html-size
